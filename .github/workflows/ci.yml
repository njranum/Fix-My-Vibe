name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The test suite is pure-Python and offline — it never touches Azure, so we
      # install the package without its runtime deps (azure-* are heavy pre-release
      # pins that aren't needed to run the tests) plus pytest. `pip install -e .`
      # still exercises the build backend, guarding the pyproject.toml config.
      - name: Install package (editable, no runtime deps) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest
      - name: Run tests
        run: pytest

  build-check:
    name: Build + entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Guards the build backend (the `setuptools.build_meta` fix) end to end:
      # the package must build into an sdist + wheel and install cleanly.
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel (no runtime deps)
        run: pip install --no-deps dist/*.whl
      - name: Verify console entry points are registered
        run: |
          fix-my-vibe --help
          python - <<'PY'
          import importlib.metadata as m
          names = {e.name for e in m.entry_points(group="console_scripts")}
          missing = {"fix-my-vibe", "fix-my-vibe-mcp"} - names
          assert not missing, f"missing entry points: {missing}"
          print("entry points OK:", sorted(names & {"fix-my-vibe", "fix-my-vibe-mcp"}))
          PY
